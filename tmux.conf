# make the escape-time in vim within tmux lower
set-option -sg escape-time 0
if-shell '[[ $TERM =~ "xterm" ]]' 'set-option -g xterm-keys on'
set-option -g history-limit 5000
if-shell '[[ $TERM =~ "-256color" ]]' 'set -g default-terminal tmux-256color'
if-shell '[[ $TERM =~ "-16color" ]]' 'set -g default-terminal screen-16color'
if-shell '[[ $TERM =~ "alacritty" ]]' 'set -g default-terminal tmux-256color'
# Taken from https://github.com/neovim/neovim/wiki/FAQ#cursor-shape-doesnt-change-in-tmux
if-shell '[[ $TERM =~ "rxvt" ]]' 'set -g -a terminal-overrides '"'"',*:Ss=\E[%p1%d q:Se=\E[2 q'"'"
# As explaind here: https://unix.stackexchange.com/a/383044/135796
set -g focus-events on

# update-environment `-u` resets the value of this array to the default - here
# to make sure re-sourcing this file won't duplicate the same variables.
set-option -gu update-environment
# Appended to tmux's own default list a few other variables I want to be adhered:
set-option -ga update-environment "DIRENV_DIFF DIRENV_DIR DIRENV_WATCHES"
set-option -ga update-environment "SSH_TTY SSH_CLIENT"
# Read by .zshrc when it picks the powerlevel10k prompt
set-option -ga update-environment "SSH_ORIGINAL_TERM SSH_TERM_NO_ICONS_FONT SSH_TMUX_ATTACH"
set-environment -gu DIRENV_DIFF
set-environment -gu DIRENV_DIR
set-environment -gu DIRENV_FILE
set-environment -gu DIRENV_DUMP_FILE_PATH
set-environment -gu DIRENV_WATCHES
# Theme:
if-shell '[[ -n "$XDG_CONFIG_HOME" ]]' \
    "source $XDG_CONFIG_HOME/tmux/theme.tmux" \
    "source $HOME/.config/tmux/theme.tmux"
# Key bindings:
if-shell '[[ -n "$XDG_CONFIG_HOME" ]]' \
    "source $XDG_CONFIG_HOME/tmux/bindings.tmux" \
    "source $HOME/.config/tmux/bindings.tmux"

# vim:ft=tmux
